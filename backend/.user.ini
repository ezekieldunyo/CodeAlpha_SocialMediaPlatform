; Per-directory PHP settings. PHP-FPM / FastCGI (Laravel Herd, Apache + FPM,
; most hosts) read this file; `php -S` does not, so pass the same values with
; -d there (see README).
;
; The API enforces its own 5 MB image limit with a clear error. PHP must allow
; a little more than that, or it drops larger files before the API sees them.
upload_max_filesize = 6M
post_max_size = 8M
